[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-asr-mce"
version = "0.1.0"
description = "Code-switching ASR evaluation for Cantonese-English: MER, PIER, language-omission and error decomposition."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Shelton1013" }]
keywords = ["asr", "code-switching", "cantonese", "mer", "evaluation", "qwen3-asr"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
score = ["opencc-python-reimplemented>=0.1.7"]
hf = ["transformers>=4.57", "torch>=2.4", "accelerate>=0.30", "soundfile>=0.12"]
datasets = ["datasets>=2.20", "soundfile>=0.12"]
funasr = ["funasr>=1.1"]
numbers = ["cn2an>=0.5"]
dev = ["pytest>=7.0"]

[project.scripts]
mce = "mce.cli:main"

[tool.setuptools.packages.find]
include = ["mce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
